name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar a release quando houver tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar Time.exe (arquivo único, sem precisar instalar o .NET)
        run: dotnet publish Time.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Gerar SHA-256 (para conferir o download)
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/Time.exe -Algorithm SHA256).Hash
          "$hash  Time.exe" | Out-File -Encoding ascii publish/Time.exe.sha256
          Write-Output "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Time-win-x64
          path: |
            publish/Time.exe
            publish/Time.exe.sha256

      # As notas da release vêm da seção da versão no CHANGELOG.md (ex.: "## 1.2.0").
      - name: Notas da versão (do CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}".TrimStart('v')
          $dentro = $false
          $notas = foreach ($linha in Get-Content CHANGELOG.md -Encoding UTF8) {
            if ($linha -match '^## ') {
              if ($dentro) { break }
              $dentro = $linha.StartsWith("## $versao")
              continue
            }
            if ($dentro) { $linha }
          }
          ($notas -join "`n").Trim() | Out-File -Encoding utf8 notas.md
          Get-Content notas.md

      # Só roda quando o push é de uma tag v* (ex.: git tag v1.2.0 && git push origin v1.2.0)
      - name: Criar release no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Time.exe
            publish/Time.exe.sha256
          body_path: notas.md
